<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>The Grove — Cards</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.ico">
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
</head>
<body>
  <main class="page-wrapper">
    <div class="page-header">
      <h1>Card Collection</h1>
      <p class="text-secondary">Manage your cards and decks</p>
    </div>

    <div class="page-content">
      <div id="cardsContainer">
        <div class="card text-center">
          <p class="text-secondary">Loading your card collection...</p>
        </div>
      </div>
    </div>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script>
<script type="module" src="/js/cards.js"></script>
</body>
</html>

        <div class="class-btn-wrap" data-desc="MAGE: Constant pressure, but fragile.">
          <button data-class="mage" class="deck-btn">
            <img src="/cards/mage-icon.webp" alt="Mage Deck">
          </button>
        </div>

        <div class="class-btn-wrap" data-desc="ROGUE: Control the fight, if you're skilled.">
          <button data-class="rogue" class="deck-btn">
            <img src="/cards/rogue-icon.webp" alt="Rogue Deck">
          </button>
        </div>

      </div>
    </div>

    <h1>Who are You?</h1>

    <div id="card-library"></div>

    <div id="overlay">
      <div class="overlay-card">
        <img id="overlay-img">
        <div class="glint"></div>
      </div>
    </div>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script>
<script type="module" src="/js/cards.js"></script>
</body>
</html>
