<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>The Grove — Signing In</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="manifest" href="/manifest.json" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #070b11;
        color: #edf7ff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      .auth-loading {
        width: min(420px, calc(100vw - 32px));
        background: rgba(19, 29, 39, 0.9);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 20px;
        padding: 28px 20px;
        text-align: center;
        box-shadow: 0 16px 56px rgba(0,0,0,0.35);
      }
      .spinner {
        width: 42px;
        height: 42px;
        border: 3px solid rgba(255,255,255,0.18);
        border-top-color: #7ad6ff;
        border-radius: 50%;
        margin: 0 auto 18px;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg);} }
      h1 {
        margin: 0 0 10px;
        font-size: clamp(1.5rem, 4vw, 2.2rem);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      p {
        margin: 0;
        color: rgba(237,247,255,0.8);
        line-height: 1.5;
      }
      .error-box {
        display: none;
      }
      .error-box.show {
        display: block;
      }
      .button-link {
        margin-top: 18px;
        display: inline-block;
        padding: 12px 18px;
        border-radius: 999px;
        background: #7ad6ff;
        color: #071019;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="auth-loading">
      <div class="spinner" aria-hidden="true"></div>
      <h1>Entering the Grove...</h1>
      <p id="authStatus">Authenticating camper...</p>
      <div id="errorBox" class="error-box" aria-live="polite">
        <p id="errorMessage">We couldn't sign you in.</p>
        <a class="button-link" href="/">Return to login</a>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/supabase-config.js"></script>
    <script type="module" src="/js/auth-callback.js"></script>
  </body>
</html>
