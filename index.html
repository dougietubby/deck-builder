<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Grove — Onboarding</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: "e1d1cb65-fbf0-4a1f-a9d4-dcc90642cb28",
      serviceWorkerPath: "/OneSignalSDKWorker.js",
      serviceWorkerUpdaterPath: "/OneSignalSDKUpdaterWorker.js",
    });
  });
  </script>

</head>

<body>

<!-- ONBOARDING PAGE ONLY -->
<div id="verificationScreen" class="modal-screen">
  <div class="onboard-box">
    <h2>Enter the Grove</h2>

    <p>
      Enter your Grove verification code.
    </p>

    <input id="codeInput" placeholder="Verification Code">
    <button id="verifyBtn">Verify</button>

    <div id="verifyResult" style="margin-top:12px;color:#f66"></div>
  </div>
</div>

<div id="welcomeScreen" class="modal-screen" style="display:none;">
  <div class="onboard-box">

    <h2>Welcome to the Grove</h2>

    <p>
      Before continuing, install the app and enable notifications.
    </p>

    <button id="installBtn">Install App</button>

    <div id="iosHint" class="hint">
      On iPhone: Tap <b>Share</b> → <b>Add to Home Screen</b>
    </div>

    <hr>

    <p>
    Enable notifications to receive camp events,
    quests, and announcements.
    </p>

    <div class="onesignal-customlink-container"></div>

    <div id="postVerifyAuth" style="margin-top:12px;">
      <p>Sign in or create your account to continue:</p>
      <input id="emailInput" placeholder="Email address" type="email">
      <button id="sendMagicLink">Send Magic Link</button>
      <div id="authResult" style="margin-top:8px;color:#f66"></div>
    </div>

    <button
      id="continueBtn"
      disabled>
      Continue
    </button>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script>
<script type="module" src="/js/onboarding.js"></script>
</body>
</html>
